            <h1 style="margin-top:12px;">References.</h1>
            <p class="lead">Every source chip in the MCP docs points here. Pages read 2026-10-30; repo files at main.</p>

            <script>
            (function () {
              var GH = 'https://github.com/thetangstr/clockchain-developer-tools/';
              function B(p) { return GH + 'blob/main/' + p; }
              function T(p) { return GH + 'tree/main/' + p; }
              function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
              var REFS = [
                [1, 'https://mcp.clockchain.network/', 'The live MCP page: services, handshake, install, footer disclaimer'],
                [2, 'https://mcp.clockchain.network/clock-tools', 'Clock tools, module 07: tools, arguments, limits, evidence'],

                [4, 'https://mcp.clockchain.network/llms.txt', 'Connect guide for agents'],
                [5, 'https://mcp.clockchain.network/handshake/sop', 'Handshake SOP: protocol v2, helper 2.1.8, pass criteria, limits'],
                [6, 'https://mcp.clockchain.network/status', 'Live status'],
                [7, B('README.md'), 'Repo README: tools by module, status, roadmap table'],
                [8, B('INSTALL.md'), 'Install: hosted, self-host, bring your own key, chat connectors'],
                [9, B('roadmap.md'), 'Roadmap and known limits, last updated 2026-09-10'],
                [10, B('packages/mcp-server/src/tools.ts'), 'The tool registry: 50 registerTool calls'],

                [12, T('eval/reports'), 'Eval reports, 2026-09-11 runs'],
                [13, B('packages/keeper/README.md'), 'Hosted keeper: delivery, anchoring, re-arm'],
                [14, B('packages/mcp-server/src/keeper-runtime.ts'), 'Keeper loop inside the MCP process'],
                [15, B('skills/clockchain-verified-alarm/SKILL.md'), 'Agent playbook for verified time'],
                [16, B('packages/core/src/receipt.ts'), 'Receipts'],
                [17, B('infra/anchoring-gateway/README.md'), 'Anchoring gateway'],
                [18, B('packages/core/src/erc8004.ts'), 'ERC-8004 registry reads'],
                [19, B('product-a-identity-decision.md'), 'Identity decision memo'],
                [20, T('packages/mcp-server/src/standalone-handshake'), 'Standalone Handshake source'],
                [21, T('packages/mcp-server/src/agent-handshake/v2'), 'Agent Handshake v2 source'],
                [22, B('docs/superpowers/specs/2026-09-14-standalone-handshake-design.md'), 'Standalone Handshake design'],
                [23, T('docs/agent-contract'), 'Agent Contract build briefs and logs'],
                [24, T('packages/mcp-server/src/agent-contract'), 'Agent Contract source'],
                [25, B('packages/core/src/tsa.ts'), 'Commitment lifecycle'],
                [26, 'https://docsend.com/view/gphvbt5saqjtvmxg', 'Film: Clockchain Network Overview, 34.6 s (Tetsuji)'],
                [27, 'https://docsend.com/view/y5rzpup27q6yknyj', 'Film: Clockchain Agent Handshake Demo, 36.5 s (Tetsuji)'],
                [28, 'https://docsend.com/view/9ruzxgzhdbvssisi', 'Film: Clockchain Agent Contract, 30 s (Tetsuji)'],
                [29, 'https://github.com/thetangstr/clockchain-handshake', 'Repo: Agent Trust Handshake product and demo'],
                [30, 'https://github.com/thetangstr/clockchain-handshake-v2', 'Repo: bilateral payment-authorization handshake demo'],

                [34, B('clock-tools-production-plan.md'), 'Clock tools production plan']
              ];
              /* repo files show as repo/path; folders end in a slash */
              function show(u) {
                if (u.indexOf(GH) === 0 && u.length > GH.length) {
                  return 'clockchain-developer-tools/' + u.slice(GH.length).replace(/^blob\/main\//, '').replace(/^tree\/main\/(.*)$/, '$1/');
                }
                return u.replace(/^https:\/\//, '');
              }
              document.getElementById('refs').innerHTML = REFS.map(function (r) {
                return '<li id="r-' + r[0] + '"><b>R' + r[0] + '</b><a href="' + r[1] + '">' + esc(show(r[1])) + '</a><span>' + esc(r[2]) + '</span></li>';
              }).join('');
            })();
            </script>

            <div class="docs-prevnext" id="docs-pn"></div>
          </article>

        </div>
